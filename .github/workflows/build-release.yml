name: Build, qualify and package JoSIM

on:
  push:
    branches: [master, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: josim-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build_linux:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-rhel6
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2010_x86_64@sha256:3b5eb5ab9bc73b93740ae4eda9962078951cd3bb7efe837b770360e78c7366fb
          - target: linux-arm64-rhel7
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64@sha256:db68ee9e5e879da5945dfbc8cab446f02245da6522aca0a9e4cda9256c911d2f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache verified source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dependencies/archives
          key: ${{ runner.os }}-sources-${{ hashFiles('cmake/dependency_sources.cmake') }}
      - name: Prepare pinned dependencies on the host
        shell: bash
        run: cmake -DJOSIM_DEPENDENCY_DIR="$GITHUB_WORKSPACE/build/dependencies" -P cmake/prepare_dependencies.cmake
      - name: Build, test and verify the package in the target userspace
        shell: bash
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker pull "$BUILD_IMAGE"
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GITHUB_SHA -e GITHUB_REF -e GITHUB_REF_NAME -e BUILD_TARGET \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "$BUILD_IMAGE" bash -c '
              set -euo pipefail
              export PATH="/opt/python/cp310-cp310/bin:$PATH"
              tag_args=()
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                tag_args=(--release-tag "$GITHUB_REF_NAME")
              fi
              python3 -B tools/build_release.py --target "$BUILD_TARGET" \
                --build-dir "build/$BUILD_TARGET" --dependencies build/dependencies \
                --artifacts artifacts --revision "$GITHUB_SHA" --parallel 4 \
                "${tag_args[@]}"
            '
      - name: Upload verified archives, manifests and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JoSIM-${{ matrix.target }}
          path: artifacts/JoSIM-*
          if-no-files-found: error
          compression-level: 0
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/**/configure.log
            build/**/build.log
            build/**/test.log
            build/**/test-results.xml
            build/**/install.log
            build/**/package-smoke.log
          if-no-files-found: ignore

  build_native:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache verified source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dependencies/archives
          key: ${{ runner.os }}-sources-${{ hashFiles('cmake/dependency_sources.cmake') }}
      - name: Build and qualify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tagArgs = @()
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $tagArgs = @('--release-tag', $env:GITHUB_REF_NAME)
          }
          python -B tools/build_release.py --target $env:BUILD_TARGET `
            --build-dir "build/$env:BUILD_TARGET" --dependencies build/dependencies `
            --artifacts artifacts --revision $env:GITHUB_SHA `
            --generator 'Visual Studio 17 2022' --parallel 4 @tagArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and qualify macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_args=(--release-tag "$GITHUB_REF_NAME")
          fi
          python3 -B tools/build_release.py --target "$BUILD_TARGET" \
            --build-dir "build/$BUILD_TARGET" --dependencies build/dependencies \
            --artifacts artifacts --revision "$GITHUB_SHA" --parallel 4 \
            "${tag_args[@]}"
      - name: Upload verified archives, manifests and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JoSIM-${{ matrix.target }}
          path: artifacts/JoSIM-*
          if-no-files-found: error
          compression-level: 0
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/**/configure.log
            build/**/build.log
            build/**/test.log
            build/**/test-results.xml
            build/**/install.log
            build/**/package-smoke.log
          if-no-files-found: ignore

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_linux, build_native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download qualified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: JoSIM-*
          path: artifacts
          merge-multiple: true
      - name: Publish all qualified targets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/JoSIM-*
          fail_on_unmatched_files: true
          generate_release_notes: true
