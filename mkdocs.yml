site_name: JoSIM Documentation
site_url: https://joeydelp.github.io/JoSIM/
repo_url: https://github.com/JoeyDelp/JoSIM
repo_name: JoeyDelp/JoSIM
site_author: Johannes Delport
edit_uri: ""
exclude_docs: |
  /context/
validation:
  links:
    anchors: warn
nav:
  - Home: 'index.md'
  - Technical Discussion: 'tech_disc.md'
  - Example Usage: 'ex_usage.md'
  - Component Stamps: 'comp_stamps.md'
  - Syntax Guide: 'syntax.md'
  - Initial States and Model Parameters: 'model_limits.md'
  - Gate-Controlled Junctions: 'gate_junctions.md'
  - Noise Sources: 'noise_sources.md'
  - Floating Flux Lines and SQUID Noise: 'squid_noise.md'
  - Parameter Sweeps and Circuit IV: 'sweeps.md'
  - Python Plotting and Specifications: 'python_utilities.md'
  - Runtime and Memory: 'performance.md'
  - Development: 'DEVELOPMENT.md'
  - Compatibility and Migration: 'compatibility.md'
  - C++ API: 'API.md'
  - Release Procedure: 'RELEASE_POLICY.md'
  - Development Schedule and Bugs: 'bugs.md'
  - Japanese 日本語版:
    - Home: 'jp/index_jp.md'
    - 技術的な議論: 'jp/tech_disc_jp.md'
    - 使用例: 'jp/ex_usage_jp.md'
    - 素子のスタンプ: 'jp/comp_stamps_jp.md'
    - 文法ガイド: 'jp/syntax_jp.md'
    - 開発スケジュール・バグ報告: 'jp/bugs_jp.md'
theme: 
  name: material
  palette:
    scheme: preference
    primary: black
  favicon: img/favicon.ico
  logo: img/favicon.ico
  features:
    - toc.integrate
    - header.autohide
  icon:
    repo: fontawesome/brands/github-alt
markdown_extensions:
  - attr_list
  - footnotes
  - pymdownx.arithmatex:
        generic: true
  - pymdownx.highlight:
        linenums: false
  - pymdownx.superfences
extra_javascript: 
  - javascripts/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/JoeyDelp
          name: JoeyDelp on GitHub

copyright: Copyright &copy; 2026 Johannes Delport
